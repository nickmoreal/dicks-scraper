name: Dicks Sporting Goods Automated Scraper

on:
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI
  schedule:
    - cron: '0 6 * * *' # Optional: Runs automatically every day at 6:00 AM UTC

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install openpyxl
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          HEADLESS: "true"
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python dicks_excel_scraper.py


      - name: Upload Scraped Excel & CSV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dicks-scraped-products
          path: |
            dicks_products.xlsx
            dicks_products.csv
          retention-days: 14
